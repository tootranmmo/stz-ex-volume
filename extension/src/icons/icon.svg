<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Background circle with cyan color -->
  <circle cx="64" cy="64" r="60" fill="#00D4FF" stroke="#0098CC" stroke-width="4"/>

  <!-- Inner circle for volume/search effect -->
  <circle cx="64" cy="64" r="45" fill="none" stroke="#FF6B9D" stroke-width="3"/>

  <!-- Center circle detail -->
  <circle cx="64" cy="64" r="30" fill="none" stroke="#FF6B9D" stroke-width="2"/>

  <!-- Magnifying glass handle - diagonal line -->
  <line x1="95" y1="95" x2="115" y2="115" stroke="#FF6B9D" stroke-width="5" stroke-linecap="round"/>

  <!-- Volume bars effect on the right -->
  <rect x="85" y="45" width="3" height="12" fill="#FF6B9D" rx="1"/>
  <rect x="92" y="40" width="3" height="22" fill="#FF6B9D" rx="1"/>
  <rect x="99" y="48" width="3" height="14" fill="#FF6B9D" rx="1"/>
</svg>
